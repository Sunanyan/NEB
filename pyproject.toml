[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neb"
version = "0.1.0"
description = "NEB and CI-NEB framework for computational chemistry"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "numba",
    "tqdm",
    "py3Dmol",
    "pyyaml",
    "pillow",
    "ipywidgets",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jupyter",
    "ipykernel",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["neb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

